---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: piaware-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/sbin/init
  - name: piaware-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /usr/sbin/init
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  config_options:
    defaults:
      remote_tmp: /var/tmp/.ansible/tmp
  inventory:
    group_vars:
      all:
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
        # Exercise the AN-79 idempotence gate. The community-repo block can't be
        # run for real in a container (no external repo, no RTL-SDR hardware), but
        # the gate that keeps it idempotent can: point piaware_packages at a
        # package the base image already has, so package_facts finds it and the
        # whole add/install/remove sequence is skipped — exactly the steady state
        # on a converged host. A regression that dropped the gate would run the
        # block here and fail the idempotence step on the always-changed apt cache.
        piaware_manage_packages: true
        piaware_packages:
          - bash
        piaware_receiver_serial: "TEST123"
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - destroy
